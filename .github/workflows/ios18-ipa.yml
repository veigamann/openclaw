# Builds an UNSIGNED .ipa with an iOS 18 deployment target for SideStore/AltStore.
name: iOS 18 sideload IPA

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Commit/branch to build"
        type: string
        default: "main"
      bundle_id:
        description: "Unique bundle id prefix"
        type: string
        default: "com.matheusveiga.openclaw"
      xcode_app:
        description: "Xcode.app to use (Xcode 26.6 IRGen crashes on this tree)"
        type: string
        default: "/Applications/Xcode_26.4.1.app"

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 1

      - name: Prepare tree for an unentitled iOS 18 build
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/veigamann/openclaw/main/sideload/prepare-tree.py" -o "$RUNNER_TEMP/prepare-tree.py"
          python3 "$RUNNER_TEMP/prepare-tree.py"

      - name: Select Xcode
        env:
          XCODE_APP: ${{ inputs.xcode_app }}
        run: |
          set -euo pipefail
          app="${XCODE_APP:-/Applications/Xcode_26.4.1.app}"
          if [ ! -d "$app" ]; then app="/Applications/Xcode.app"; fi
          sudo xcode-select -s "$app/Contents/Developer"
          echo "using $app"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare --activate

      - name: Install JS inputs for the iOS generator
        run: |
          pnpm install --frozen-lockfile \
            --filter '@openclaw/mermaid-renderer...' \
            --filter '@openclaw/gateway-protocol...'

      - name: Install pinned xcodegen
        run: |
          set -euo pipefail
          ./scripts/install-xcodegen.sh "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen" >> "$GITHUB_PATH"

      - name: Build unsigned IPA
        env:
          APP_BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -euo pipefail

          {
            echo "OPENCLAW_CODE_SIGN_STYLE = Manual"
            echo "OPENCLAW_CODE_SIGN_IDENTITY = -"
            echo "OPENCLAW_DEVELOPMENT_TEAM ="
            echo "OPENCLAW_APP_BUNDLE_ID = $APP_BUNDLE_ID"
            echo "OPENCLAW_SHARE_BUNDLE_ID = $APP_BUNDLE_ID.share"
            echo "OPENCLAW_APP_GROUP_ID = group.$APP_BUNDLE_ID.shared"
            echo "OPENCLAW_ACTIVITY_WIDGET_BUNDLE_ID = $APP_BUNDLE_ID.activitywidget"
            echo "OPENCLAW_WATCH_APP_BUNDLE_ID = $APP_BUNDLE_ID.watchkitapp"
            echo "OPENCLAW_APP_PROFILE ="
            echo "OPENCLAW_SHARE_PROFILE ="
            echo "OPENCLAW_ACTIVITY_WIDGET_PROFILE ="
            echo "OPENCLAW_WATCH_APP_PROFILE ="
          } > apps/ios/.local-signing.xcconfig
          cat apps/ios/.local-signing.xcconfig

          bash scripts/ios-write-version-xcconfig.sh
          node scripts/ios-write-swift-filelist.mjs

          if ! command -v swiftformat >/dev/null 2>&1 || ! command -v swiftlint >/dev/null 2>&1; then
            ./scripts/install-swift-tools.sh "$PWD/.build/swift-tools"
            export PATH="$PWD/.build/swift-tools:$PATH"
          fi

          ( cd apps/ios && xcodegen generate )

          xcodebuild \
            -project apps/ios/OpenClaw.xcodeproj \
            -scheme OpenClaw \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/OpenClaw.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

          APP="build/OpenClaw.xcarchive/Products/Applications/OpenClaw.app"
          test -d "$APP"
          test ! -d "$APP/_CodeSignature"
          rm -rf build/Payload build/OpenClaw-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          ( cd build && /usr/bin/zip -qry OpenClaw-unsigned.ipa Payload )
          ls -lh build/OpenClaw-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-unsigned-ipa
          path: build/OpenClaw-unsigned.ipa
          if-no-files-found: error
